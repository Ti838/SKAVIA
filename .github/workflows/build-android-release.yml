name: Build SKAVIA Signed Android APK

on:
  workflow_dispatch:
    inputs:
      release_note_summary:
        description: 'Short label for this build artifact (optional)'
        required: false
        default: 'arm64-release'
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-android-arm64:
    name: Build Signed ARM64 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify shared team signing secrets are configured
        env:
          KEYSTORE_B64: ${{ secrets.SKAVIA_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.SKAVIA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SKAVIA_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SKAVIA_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Missing Android signing secrets. Add SKAVIA_KEYSTORE_BASE64, SKAVIA_KEYSTORE_PASSWORD, SKAVIA_KEY_ALIAS, and SKAVIA_KEY_PASSWORD in GitHub Repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Decode shared SKAVIA release keystore
        env:
          KEYSTORE_B64: ${{ secrets.SKAVIA_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/skavia-release.jks

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build universal signed ARM (32-bit + 64-bit) release APK
        env:
          SKAVIA_KEYSTORE_FILE: skavia-release.jks
          SKAVIA_KEYSTORE_PASSWORD: ${{ secrets.SKAVIA_KEYSTORE_PASSWORD }}
          SKAVIA_KEY_ALIAS: ${{ secrets.SKAVIA_KEY_ALIAS }}
          SKAVIA_KEY_PASSWORD: ${{ secrets.SKAVIA_KEY_PASSWORD }}
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64 --dart-define=SKAVIA_WEB_ORIGIN=https://skavia-bd.vercel.app

      - name: Compute APK metadata & SHA-256 checksum
        id: meta
        run: |
          RAW_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION_NAME=$(echo "$RAW_VERSION" | cut -d'+' -f1)
          BUILD_NUM=$(echo "$RAW_VERSION" | cut -d'+' -f2)
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          SIZE_BYTES=$(stat -c%s "$APK_PATH")
          SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE_BYTES / 1048576}")
          
          # Copy to canonical release filenames
          cp "$APK_PATH" "skavia-latest.apk"
          cp "$APK_PATH" "skavia-v${VERSION_NAME}.apk"

          echo "raw_version=$RAW_VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build_num=$BUILD_NUM" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size_mb=$SIZE_MB" >> "$GITHUB_OUTPUT"
          
          echo "### 🚀 SKAVIA Production Signed APK Ready" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** \`$VERSION_NAME\` (Build #\`$BUILD_NUM\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **APK Size:** \`${SIZE_MB} MB\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SHA-256 Checksum:** \`$SHA256\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Direct CDN Download:** \`https://github.com/${{ github.repository }}/releases/download/v${VERSION_NAME}/skavia-latest.apk\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up decoded keystore from runner
        if: always()
        run: rm -f android/skavia-release.jks

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: SKAVIA Production Release v${{ steps.meta.outputs.version }} (Build #${{ steps.meta.outputs.build_num }})
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.meta.outputs.version) }}
          files: |
            skavia-latest.apk
            skavia-v${{ steps.meta.outputs.version }}.apk
          body: |
            ## 🚀 SKAVIA Official Android Production Release v${{ steps.meta.outputs.version }}
            - **Build Number:** `${{ steps.meta.outputs.build_num }}`
            - **Package Name:** `com.skavia.skavia`
            - **Universal APK Size:** `${{ steps.meta.outputs.size_mb }} MB`
            - **SHA-256 Fingerprint:** `${{ steps.meta.outputs.sha256 }}`
            
            ### 📥 Direct Fast Download
            Download [skavia-latest.apk](https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.meta.outputs.version) }}/skavia-latest.apk)
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Upload signed APK artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: skavia-apk-${{ steps.meta.outputs.version }}-${{ github.run_number }}
          path: skavia-latest.apk
          retention-days: 30
