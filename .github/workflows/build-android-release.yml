name: Build SKAVIA Signed Android APK

on:
  workflow_dispatch:
    inputs:
      release_note_summary:
        description: 'Short label for this build artifact (optional)'
        required: false
        default: 'arm64-release'
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-android-arm64:
    name: Build Signed ARM64 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify shared team signing secrets are configured
        env:
          KEYSTORE_B64: ${{ secrets.SKAVIA_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.SKAVIA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SKAVIA_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SKAVIA_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Missing Android signing secrets. Add SKAVIA_KEYSTORE_BASE64, SKAVIA_KEYSTORE_PASSWORD, SKAVIA_KEY_ALIAS, and SKAVIA_KEY_PASSWORD in GitHub Repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Decode shared SKAVIA release keystore
        env:
          KEYSTORE_B64: ${{ secrets.SKAVIA_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/skavia-release.jks

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build compact signed ARM64 release APK
        env:
          SKAVIA_KEYSTORE_FILE: skavia-release.jks
          SKAVIA_KEYSTORE_PASSWORD: ${{ secrets.SKAVIA_KEYSTORE_PASSWORD }}
          SKAVIA_KEY_ALIAS: ${{ secrets.SKAVIA_KEY_ALIAS }}
          SKAVIA_KEY_PASSWORD: ${{ secrets.SKAVIA_KEY_PASSWORD }}
        run: |
          flutter build apk --release --target-platform android-arm64 --dart-define=SKAVIA_WEB_ORIGIN=https://skavia-bd.vercel.app

      - name: Compute APK metadata & SHA-256 checksum
        id: meta
        run: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          SIZE_BYTES=$(stat -c%s "$APK_PATH")
          SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE_BYTES / 1048576}")
          echo "version=$VERSION_LINE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size_mb=$SIZE_MB" >> "$GITHUB_OUTPUT"
          echo "### SKAVIA Signed ARM64 Release APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- **pubspec version:** \`$VERSION_LINE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **APK Size:** \`${SIZE_MB} MB\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **APK SHA-256:** \`$SHA256\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Next step: Download the artifact below and upload it in **SKAVIA Admin Portal -> App Releases -> Publish New APK**." >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up decoded keystore from runner
        if: always()
        run: rm -f android/skavia-release.jks

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: skavia-apk-${{ steps.meta.outputs.version }}-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
